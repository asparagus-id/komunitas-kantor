[package]
name = "cctv-backup-agent"
version = "1.0.0"
description = "Agen pemantau CCTV cadangan -- numpang jalan di komputer lain sbg redundansi, tanpa UI pengaturan (semua konfigurasi diambil dari server Monitor)"
authors = ["Edwin Prayoga"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1", features = ["http-all", "shell-open", "system-tray", "icon-ico"] }
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "cctv-backup-agent"
path = "src/main.rs"
