[package]
name = "pengingat-sholat-desktop"
version = "1.4.0"
description = "Pengingat waktu adzan untuk layar kantor"
authors = ["Edwin Prayoga"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1", features = ["notification-all", "http-all", "shell-open"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "pengingat-sholat-desktop"
path = "src/main.rs"
