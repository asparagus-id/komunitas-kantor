name: Build and Rilis CCTV Backup Agent

on: {push: {tags: ["cctv-agent-v*"]}, workflow_dispatch: {}}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cctv-backup-agent
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build, tanda tangani, dan terbitkan rilis
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: cctv-backup-agent
          tagName: cctv-agent-v__VERSION__
          releaseName: CCTV Backup Agent v__VERSION__
          releaseBody: Update otomatis CCTV Backup Agent.
          releaseDraft: false
          prerelease: false

      - name: Upload juga sebagai Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cctv-backup-agent-windows
          path: |
            cctv-backup-agent/src-tauri/target/release/bundle/msi/*.msi
            cctv-backup-agent/src-tauri/target/release/bundle/nsis/*.exe
