name: (Sekali Pakai) Generate Kunci Auto-Update

# WORKFLOW SEKALI PAKAI -- jalankan manual SATU KALI SAJA di awal setup
# auto-update, lewat tab Actions > pilih workflow ini > "Run workflow".
# Setelah kuncinya sudah diambil & disimpan sbg Secret (lihat SOP), file
# workflow ini boleh dihapus dari repo -- tidak dibutuhkan lagi setelahnya.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate keypair (PAKAI password, hindari bug kunci tanpa password)
        run: npx --yes @tauri-apps/cli@1 signer generate -w ./pengingat-sholat.key --password "PengingatSholatKantor2026!"

      - name: Tampilkan PUBLIC key (aman dilihat, BUKAN rahasia)
        run: |
          echo "=================================================="
          echo "COPY teks di antara PUBKEY_MULAI dan PUBKEY_SELESAI"
          echo "(TIDAK TERMASUK baris PUBKEY_MULAI/PUBKEY_SELESAI"
          echo "itu sendiri) ke tauri.conf.json, gantikan placeholder"
          echo "GANTI_DENGAN_PUBLIC_KEY_HASIL_LANGKAH_1_SOP :"
          echo "=================================================="
          echo "PUBKEY_MULAI"
          cat ./pengingat-sholat.key.pub
          echo ""
          echo "PUBKEY_SELESAI"
          echo "=================================================="
          echo "PENTING: kunci ini PAKAI PASSWORD (beda dari sebelumnya)."
          echo "Selain simpan TAURI_PRIVATE_KEY dari Artifacts, WAJIB juga"
          echo "buat 1 Secret lagi:"
          echo "  Name : TAURI_KEY_PASSWORD"
          echo "  Value: PengingatSholatKantor2026!"
          echo "=================================================="

      - name: Simpan PRIVATE key sbg artifact (RAHASIA -- jangan disebar)
        uses: actions/upload-artifact@v4
        with:
          name: pengingat-sholat-PRIVATE-KEY-RAHASIA
          path: ./pengingat-sholat.key
