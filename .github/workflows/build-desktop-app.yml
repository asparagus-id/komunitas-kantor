name: Build Pengingat Sholat Desktop

# PENTING kalau file ini digabung ke repo yang SUDAH ADA (mis. repo yang
# sama dgn worker-komunitas.js & data/komunitas-data.json):
# - Project Tauri ini HARUS ditaruh di subfolder "desktop-app/" (bukan di
#   root repo), supaya tidak bentrok dgn file lain yg sudah ada di repo.
# - Workflow ini SENGAJA cuma jalan kalau ada perubahan di folder
#   "desktop-app/**" (lihat "paths" di bawah) -- jadi update bot Telegram,
#   data komunitas, dll di repo yang sama TIDAK ikut men-trigger build ini.
on:
  push:
    branches: [main]
    paths:
      - "desktop-app/**"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        # semua command di bawah otomatis dijalankan DI DALAM folder ini
        working-directory: desktop-app
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build installer (.msi & .exe)
        run: npx tauri build

      - name: Upload hasil build
        uses: actions/upload-artifact@v4
        with:
          name: pengingat-sholat-windows
          path: |
            desktop-app/src-tauri/target/release/bundle/msi/*.msi
            desktop-app/src-tauri/target/release/bundle/nsis/*.exe

